name: 功能建议 / Feature request
description: 新功能或改进 / A new feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / What problem does it solve
      description: 先说使用场景，而不是具体做法 / Describe the situation first, not the solution
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法 / Proposed solution
  - type: checkboxes
    id: scope
    attributes:
      label: 项目原则 / Project principles
      options:
        - label: 不依赖云服务，数据仍只保存在用户自己的设备上 / No cloud dependency; data stays on the user's own devices
          required: true
        - label: 我愿意尝试提交实现 / I'd like to try implementing it
